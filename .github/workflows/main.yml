name: Build dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: SDK iOS
        run: git clone --depth 1 https://github.com/theos/sdks.git
      - name: Compiler
        run: |
          SDK=$(realpath $(ls -d sdks/iPhoneOS*.sdk | sort -V | tail -1))
          echo "SDK utilisé : $SDK"
          clang --target=arm64-apple-ios13.0 -isysroot "$SDK" \
            -fobjc-arc -dynamiclib -fuse-ld=lld \
             -framework Foundation -framework UIKit -framework QuartzCore -framework CoreGraphics \
            -o Chrono.dylib Chrono.m
      - uses: actions/upload-artifact@v4
        with:
          name: Chrono
          path: Chrono.dylib
